# ═══════════════════════════════════════════════
# Nginx — konfiguracja DEV (localhost, HTTP only)
# Brak SSL. COOP/COEP nadal wymagane dla Godot WASM.
# Ścieżki: /srv/landing (landing page), /srv/game/ (gry)
# ═══════════════════════════════════════════════

events {
    worker_connections 512;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile     on;
    server_tokens off;

    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root  /srv/landing;
        index index.html;

        # ── KRYTYCZNE: wymagane przez Godot 4 WebAssembly ──
        # SharedArrayBuffer działa tylko z tymi nagłówkami.
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # ── Landing page ───────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Gra 2D ────────────────────────────────────────
        location /game/2d/ {
            alias /srv/game/2d/;
            try_files $uri $uri/ =404;

            # Brak cache w dev — pliki zmieniają się często
            location ~* \.(html|wasm|pck|js)$ {
                add_header Cross-Origin-Opener-Policy   "same-origin"  always;
                add_header Cross-Origin-Embedder-Policy "require-corp" always;
                add_header Cross-Origin-Resource-Policy "cross-origin" always;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }
        }

        # ── Gra 3D ────────────────────────────────────────
        location /game/3d/ {
            alias /srv/game/3d/;
            try_files $uri $uri/ =404;

            location ~* \.(html|wasm|pck|js)$ {
                add_header Cross-Origin-Opener-Policy   "same-origin"  always;
                add_header Cross-Origin-Embedder-Policy "require-corp" always;
                add_header Cross-Origin-Resource-Policy "cross-origin" always;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }
        }
    }
}
