# ═══════════════════════════════════════════════════════
# Planeta Bzzzt! — Docker Compose dla VPS z istniejącym Nginx
#
# Twój Nginx na hoście zajmuje się SSL i nasłuchuje na 80/443.
# Kontener Dockera nasłuchuje lokalnie na porcie 8181.
# ═══════════════════════════════════════════════════════

services:
  web:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile.reverse-proxy
    container_name: planeta-bzzzt-web
    restart: unless-stopped
    ports:
      # Bezpiecznie wystawione tylko lokalnie na hoście:
      - "127.0.0.1:8181:80"
    volumes:
      # Montowanie wyeksportowanych gier (aktualizacja bez rebuildu obrazu):
      - ../web/2d:/usr/share/nginx/html/game/2d:ro
      - ../web/3d:/usr/share/nginx/html/game/3d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
