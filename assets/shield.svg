<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Neon Shield Glow Filter -->
    <filter id="shieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="shieldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="shieldCoreRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Outer Protective Barrier (Hexagonal Force Field) -->
  <polygon points="80,10 140,45 140,115 80,150 20,115 20,45"
           fill="url(#shieldFillGrad)"
           stroke="url(#shieldRimGrad)"
           stroke-width="5"
           filter="url(#shieldGlow)"/>

  <!-- Inner Hexagon Grid -->
  <polygon points="80,28 126,54 126,106 80,132 34,106 34,54"
           fill="none"
           stroke="#38bdf8"
           stroke-width="2.5"
           stroke-dasharray="8 4"
           opacity="0.85"/>

  <!-- Center Energy Core / Crest -->
  <circle cx="80" cy="80" r="32" fill="url(#shieldCoreRadial)" filter="url(#shieldGlow)"/>
  
  <!-- Energy Nodes on Vertices -->
  <circle cx="80" cy="10" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="140" cy="45" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="140" cy="115" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="80" cy="150" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="20" cy="115" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="20" cy="45" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>

  <!-- Core Cross Emblems -->
  <path d="M 80 56 L 80 104 M 56 80 L 104 80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#shieldGlow)"/>
</svg>
