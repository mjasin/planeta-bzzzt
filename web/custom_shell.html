<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0b0d19;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ══════════════════════════════════════════════
   MOBILE LANDSCAPE PROMPT & ORIENTATION LOCK
   ══════════════════════════════════════════════ */
#landscape-prompt {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 99999;
	background: radial-gradient(circle at center, #1b1035 0%, #080912 100%);
	color: #ffffff;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
}

.landscape-icon {
	font-size: 4rem;
	margin-bottom: 16px;
	animation: rotate-phone 2s infinite ease-in-out;
}

.landscape-title {
	font-size: 1.6rem;
	font-weight: 800;
	color: #00d4ff;
	text-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
	margin-bottom: 8px;
}

.landscape-subtitle {
	font-size: 1rem;
	color: #a0a5c0;
	max-width: 320px;
	line-height: 1.4;
}

@keyframes rotate-phone {
	0% { transform: rotate(0deg); }
	35% { transform: rotate(-90deg); }
	65% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

/* Show prompt on any touch device in portrait orientation */
@media screen and (orientation: portrait) and (max-width: 1024px) {
	#landscape-prompt {
		display: flex !important;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<!-- Landscape Mode Prompt for Mobile -->
		<div id="landscape-prompt">
			<div class="landscape-icon">📱🔄</div>
			<div class="landscape-title">Obróć telefon poziomo</div>
			<div class="landscape-subtitle">Planeta Bzzzt! wymaga trybu poziomego (landscape), aby sterowanie i widok działały idealnie! 🚀</div>
		</div>

		<canvas id="canvas">
			Twoja przeglądarka nie obsługuje elementu Canvas.
		</canvas>

		<noscript>
			Twoja przeglądarka nie ma włączonej obsługi JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--$GODOT_SPLASH_IMAGE fullsize--$GODOT_SPLASH_FULLSIZE use-filter--$GODOT_SPLASH_USE_FILTER" src="$GODOT_SPLASH_URL" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Bulletproof iOS / Android Landscape & Fullscreen Enforcement
const promptEl = document.getElementById('landscape-prompt');
let wasPortrait = true;

function requestMobileFullscreen() {
	const docEl = document.documentElement;
	const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
	if (requestFS && !document.fullscreenElement && !document.webkitFullscreenElement) {
		requestFS.call(docEl).catch(() => {});
	}
}

function checkOrientation() {
	const isTouch = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
	const isPortrait = window.innerHeight > window.innerWidth;
	if (isTouch && isPortrait && window.innerWidth <= 1024) {
		promptEl.style.display = 'flex';
		wasPortrait = true;
	} else if (!isPortrait || !isTouch) {
		promptEl.style.display = 'none';
		// Gdy użytkownik właśnie obrócił telefon do poziomu:
		if (isTouch && wasPortrait) {
			wasPortrait = false;
			requestMobileFullscreen();
		}
	}
}

function tryLockLandscape() {
	if (screen.orientation && screen.orientation.lock) {
		screen.orientation.lock('landscape').catch(() => {});
	}
	checkOrientation();
	const isTouch = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
	if (isTouch && window.innerWidth > window.innerHeight) {
		requestMobileFullscreen();
	}
}

window.addEventListener('load', tryLockLandscape);
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => {
	setTimeout(() => {
		checkOrientation();
		const isTouch = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
		if (isTouch && window.innerWidth > window.innerHeight) {
			requestMobileFullscreen();
		}
	}, 150);
});
document.addEventListener('touchstart', tryLockLandscape, { passive: true, once: true });
document.addEventListener('click', tryLockLandscape, { passive: true, once: true });
checkOrientation();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
